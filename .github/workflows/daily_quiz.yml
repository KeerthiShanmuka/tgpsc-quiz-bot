name: Daily TGPSC Quiz Publisher

on:
  schedule:
    # 10 daily slots in Asia/Kolkata (IST = UTC + 5:30):
    # 07:00 IST -> 01:30 UTC
    # 07:30 IST -> 02:00 UTC
    # 08:00 IST -> 02:30 UTC
    # 08:30 IST -> 03:00 UTC
    # 09:00 IST -> 03:30 UTC
    # 09:30 IST -> 04:00 UTC
    # 10:00 IST -> 04:30 UTC
    # 10:30 IST -> 05:00 UTC
    # 11:00 IST -> 05:30 UTC
    # 11:30 IST -> 06:00 UTC
    - cron: '30 1,2,3,4,5 * * *'
    - cron: '0 2,3,4,5,6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of questions to publish'
        required: true
        default: '1'
      dry_run:
        description: 'Dry run (simulate without sending)'
        required: false
        type: boolean
        default: false
      category:
        description: 'Specific category filter (optional)'
        required: false
        default: ''

concurrency:
  group: daily-quiz-posting
  cancel-in-progress: false

jobs:
  publish_quiz:
    name: Publish Quiz Question
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quiz publisher
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TARGET_CHAT_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.count }}" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --count ${{ github.event.inputs.count }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --dry-run"
            fi
            if [ -n "${{ github.event.inputs.category }}" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --category '${{ github.event.inputs.category }}'"
            fi
          else
            EXTRA_ARGS="--count 1"
          fi
          python scripts/publish_quiz.py $EXTRA_ARGS

      - name: Preserve posting history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update posted quiz history [skip ci]" && git push)
